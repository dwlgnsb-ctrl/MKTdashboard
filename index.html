<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mary&May 마케팅 예산 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#FBF4F3; --card:#FFFFFF; --card2:#F6DEDB;
    --border:#F0DAD6; --text:#3A2321; --muted:#A47D78;
    --accent:#C9664F; --accent-dark:#8C3A2D;
    --green-bg:#E3EEDC; --green-text:#2F5A1E;
    --amber-bg:#FBE9D2; --amber-text:#8A5A12;
    --red-bg:#F8D9D3; --red-text:#8C2A1C;
  }
  *{box-sizing:border-box;}
  body{font-family:"Malgun Gothic","맑은 고딕",sans-serif;background:var(--bg);color:var(--text);margin:0;padding:24px;}
  .wrap{max-width:1180px;margin:0 auto;}
  h1{font-size:20px;font-weight:700;margin:0 0 16px;color:var(--text);}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  select{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:13px;color:var(--text);}
  .muted{color:var(--muted);font-size:12px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:20px;}
  .card2{background:var(--card2);border-radius:8px;padding:14px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .label{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .num{font-size:22px;font-weight:700;}
  .section-title{font-size:14px;font-weight:700;margin:24px 0 8px;color:var(--text);}
  .section-title:first-child{margin-top:0;}
  table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
  td{padding:5px 0;vertical-align:top;}
  thead td{color:var(--muted);font-size:12px;padding-bottom:6px;}
  .tier-row td{padding-top:10px;padding-bottom:4px;color:var(--text);font-weight:700;border-top:1px solid var(--border);}
  tr.datarow td{border-top:none;}
  .amt{font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .chip{font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700;white-space:nowrap;}
  .na{font-size:12px;color:var(--muted);}
  .pct-r{text-align:right;font-weight:700;}
  .country-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 20px;font-size:12px;}
  .country-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);}
  .alert{border-radius:8px;padding:10px 12px;font-size:12px;}
  .alert-danger{background:var(--red-bg);color:var(--red-text);}
  .alert-warning{background:var(--amber-bg);color:var(--amber-text);}
  .alert-muted{background:var(--card2);color:var(--accent-dark);}
  .card-title{font-size:13px;font-weight:700;margin-bottom:6px;}
  #error-banner{display:none;background:var(--red-bg);color:var(--red-text);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;}
  .footnote{font-size:11px;color:var(--muted);margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mary&May 마케팅 예산 대시보드</h1>
  <div id="error-banner"></div>

  <div class="topbar">
    <select id="monthSelect"></select>
    <span class="muted" id="dayProgress"></span>
  </div>

  <div class="card">
    <div class="grid4" id="topSummary"></div>
  </div>

  <div class="section-title">채널별 총예산</div>
  <div class="grid4" id="channelCards" style="margin-bottom:20px;"></div>

  <div class="section-title">국가별 예산 비중 (전체)</div>
  <div class="card" id="countryShareCard"></div>

  <div class="section-title">소진 알림</div>
  <div class="grid3" id="alerts" style="margin-bottom:20px;"></div>

  <div class="section-title">루틴 (국가 티어)</div>
  <div class="card">
    <table>
      <thead><tr><td style="width:18%">국가</td><td style="width:24%">메타 예산/소진</td><td style="width:24%">틱톡 예산/소진</td><td style="width:17%" class="pct-r">현재 소진율</td><td style="width:17%" class="pct-r">예상 월말</td></tr></thead>
      <tbody id="routineTable"></tbody>
    </table>
    <div class="footnote">메타루틴 / 틱톡루틴 raw 기준, 미국·일본 제외 전체 티어 국가</div>
  </div>

  <div class="section-title">미국 · 일본</div>
  <div class="card">
    <table>
      <thead><tr>
        <td style="width:11%">국가</td>
        <td style="width:17.8%">메타 예산/소진</td>
        <td style="width:17.8%">틱톡 예산/소진</td>
        <td style="width:17.8%">구글 예산/소진</td>
        <td style="width:17.8%">팔로우광고 예산/소진</td>
        <td style="width:17.8%">싱글원 예산/소진</td>
      </tr></thead>
      <tbody id="usJpTable"></tbody>
    </table>
    <div class="footnote">미국 메타 = 메타루틴(US) + 비욘드어스메타 합산 · 일본 메타 = 메타루틴(JP) · 팔로우광고 = 일본팔로우메타 · 싱글원 = 일본싱글원(엔화→원화 고정환율 환산)</div>
  </div>

  <div class="section-title">개별 운영 항목</div>
  <div class="grid3" id="standaloneCards"></div>
</div>

<script>
/* ===================== 설정 ===================== */
const SPREADSHEET_ID = "1-gZrBKjTlxhc6VCJWsFDjM6epwaGvGP5q81Dadx8SP8";
const JPY_TO_KRW_RATE = 8.2; // 고정환율: 1엔 = 8.2원 (실제 값으로 교체 필요)

const SHEETS = {
  budget: "월예산Budget",
  beyondUs: "비욘드어스메타",
  metaRoutine: "메타루틴",
  jpTiktok: "일본틱톡",
  tiktokRoutine: "틱톡루틴",
  sparkAds: "스파크애즈틱톡",
  gmvPdrn: "GMVMAX(PDRN)",
  gmvAll: "GMVMAX(ALL)",
  google: "구글",
  jpSingleOne: "일본싱글원",
  jpFollow: "일본팔로우메타",
  kbeautyCandy: "K뷰티캔디"
};

function gvizUrl(sheetName){
  return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
}

/* ===================== 국가 정규화 ===================== */
const ISO_NAME = {US:"미국",JP:"일본",BR:"브라질",DE:"독일",FR:"프랑스",GB:"영국",PL:"폴란드",CZ:"체코",
  SA:"사우디아라비아",AE:"아랍에미리트",EG:"이집트",IL:"이스라엘",MX:"멕시코",PY:"파라과이",CL:"칠레",
  KH:"캄보디아",VN:"베트남",HK:"홍콩",TR:"터키",AU:"호주",GE:"조지아"};
const ENGLISH_NAME = {"united states":"미국","japan":"일본","brazil":"브라질","germany":"독일","france":"프랑스",
  "united kingdom":"영국","poland":"폴란드","czech republic":"체코","czechia":"체코","saudi arabia":"사우디아라비아",
  "united arab emirates":"아랍에미리트","egypt":"이집트","israel":"이스라엘","mexico":"멕시코","paraguay":"파라과이",
  "chile":"칠레","cambodia":"캄보디아","vietnam":"베트남","hong kong":"홍콩","turkey":"터키","australia":"호주",
  "georgia":"조지아"};

function normalizeCountry(v){
  if(!v) return null;
  const s = String(v).trim();
  if(!s || /^unknown$/i.test(s)) return null;
  if(ISO_NAME[s.toUpperCase()]) return ISO_NAME[s.toUpperCase()];
  const en = ENGLISH_NAME[s.toLowerCase()];
  if(en) return en;
  return s; // 이미 한글 국가명인 경우 (구글 시트, 예산 시트 등)
}

/* 루틴 테이블 티어 (미국/일본 제외) */
const COUNTRY_TIER = {
  "사우디아라비아":1,"브라질":1,
  "베트남":2,"터키":2,"폴란드":2,"독일":2,"프랑스":2,"멕시코":2,
  "홍콩":3,"캄보디아":3,"조지아":3,"영국":3,"체코":3,"칠레":3,"파라과이":3,"아랍에미리트":3,"호주":3,"이집트":3,"이스라엘":3
};

/* ===================== 날짜 처리 ===================== */
function normalizeDate(v){
  if(!v) return "";
  const s = String(v).trim();
  const m = s.match(/^Date\((\d+),\s*(\d+),\s*(\d+)/);
  if(m){
    const y=m[1], mo=String(parseInt(m[2],10)+1).padStart(2,"0"), d=String(parseInt(m[3],10)).padStart(2,"0");
    return `${y}-${mo}-${d}`;
  }
  // "2026. 9. 30" 형식 (GMVMAX(ALL))
  const dotted = s.match(/^(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/);
  if(dotted){
    return `${dotted[1]}-${dotted[2].padStart(2,"0")}-${dotted[3].padStart(2,"0")}`;
  }
  return s.slice(0,10);
}
function monthOf(dateStr){ return normalizeDate(dateStr).slice(0,7); }

/* ===================== 숫자 파싱 ===================== */
function num(v){
  if(v===undefined||v===null||v==="") return 0;
  const n = parseFloat(String(v).replace(/[",%]/g,""));
  return isNaN(n) ? 0 : n;
}

/* ===================== CSV 로드 ===================== */
const FETCH_ERRORS = [];
function loadSheet(key){
  return new Promise((resolve)=>{
    Papa.parse(gvizUrl(SHEETS[key]), {
      download:true, header:true, skipEmptyLines:true,
      complete: (res)=> resolve(res.data || []),
      error: (err)=>{ FETCH_ERRORS.push(`${SHEETS[key]}: ${err}`); resolve([]); }
    });
  });
}

/* ===================== 메인 로직 ===================== */
let DATA = {}; // key -> rows
let SELECTED_MONTH = null;

async function init(){
  const keys = Object.keys(SHEETS);
  const results = await Promise.all(keys.map(loadSheet));
  keys.forEach((k,i)=> DATA[k]=results[i]);

  if(FETCH_ERRORS.length){
    const el = document.getElementById("error-banner");
    el.style.display="block";
    el.textContent = "일부 시트를 불러오지 못했습니다: " + FETCH_ERRORS.join(" / ");
  }

  // 사용 가능한 월 목록 (예산 시트 기준)
  const months = Array.from(new Set(DATA.budget.map(r=>r["월"]).filter(Boolean))).sort();
  const sel = document.getElementById("monthSelect");
  months.forEach(m=>{
    const opt = document.createElement("option");
    opt.value = m; opt.textContent = m.replace("-","년 ")+"월";
    sel.appendChild(opt);
  });
  SELECTED_MONTH = months[months.length-1];
  sel.value = SELECTED_MONTH;
  sel.addEventListener("change", ()=>{ SELECTED_MONTH = sel.value; render(); });

  render();
}

/* 예산 집계: 국가/매체별 버킷 + 특수 항목 분리 */
function aggregateBudget(month){
  const rows = DATA.budget.filter(r=>r["월"]===month);
  const buckets = {}; // "국가|매체" -> 금액
  const special = { gmv:0, sparkAds:0, singleOne:0, follow:0, kbeauty:0 };

  rows.forEach(r=>{
    const adType = (r["광고유형"]||"").trim();
    const item = (r["캠페인/항목"]||"").trim();
    const country = (r["국가"]||"").trim();
    const media = (r["매체"]||"").trim();
    const amount = num(r["예산(원)"]);

    if(adType==="국내광고") return; // 완전 제외
    if(item==="틱톡샵 GMV"){ special.gmv += amount; return; }
    if(item==="틱톡샵 자체 광고"){ special.sparkAds += amount; return; }
    if(item==="싱글원"){ special.singleOne += amount; return; }
    if(adType==="팔로우광고"){ special.follow += amount; return; }
    if(adType==="K뷰티 캔디"){ special.kbeauty += amount; return; }

    const key = country+"|"+media;
    buckets[key] = (buckets[key]||0) + amount;
  });

  return { buckets, special };
}

/* 실적 집계 헬퍼: rows를 국가별로 그룹핑해서 지출 합산 */
function sumByCountry(rows, dateField, countryField, spendField, month, rateMultiplier){
  const out = {};
  rows.forEach(r=>{
    if(monthOf(r[dateField]) !== month) return;
    const c = normalizeCountry(r[countryField]);
    if(!c) return;
    const spend = num(r[spendField]) * (rateMultiplier||1);
    out[c] = (out[c]||0) + spend;
  });
  return out;
}
function sumTotal(rows, dateField, spendField, month, rateMultiplier){
  let total = 0;
  rows.forEach(r=>{
    if(monthOf(r[dateField]) !== month) return;
    total += num(r[spendField]) * (rateMultiplier||1);
  });
  return total;
}

function aggregateActuals(month){
  const metaRoutineByCountry = sumByCountry(DATA.metaRoutine, "일", "국가", "지출 금액 (KRW)", month);
  const tiktokRoutineByCountry = sumByCountry(DATA.tiktokRoutine, "일별", "국가/지역", "지출", month);
  const beyondUsTotal = sumTotal(DATA.beyondUs, "일", "지출 금액 (KRW)", month);
  const jpTiktokTotal = sumTotal(DATA.jpTiktok, "일별", "지출", month);
  const googleTotal = sumTotal(DATA.google, "일", "비용", month);
  const jpFollowTotal = sumTotal(DATA.jpFollow, "일", "지출 금액 (KRW)", month);
  const jpSingleOneTotal = sumTotal(DATA.jpSingleOne, "date", "cost", month, JPY_TO_KRW_RATE);
  const sparkAdsTotal = sumTotal(DATA.sparkAds, "일별", "지출", month);
  const gmvTotal = sumTotal(DATA.gmvPdrn, "날짜", "Cost", month) + sumTotal(DATA.gmvAll, "날짜", "Cost", month);
  const kbeautyTotal = sumTotal(DATA.kbeautyCandy, "일", "지출 금액 (KRW)", month);

  const usMeta = (metaRoutineByCountry["미국"]||0) + beyondUsTotal;
  const jpMeta = metaRoutineByCountry["일본"]||0;
  const usTiktok = tiktokRoutineByCountry["미국"]||0;

  return {
    metaRoutineByCountry, tiktokRoutineByCountry,
    usMeta, jpMeta, usTiktok, jpTiktokTotal, googleTotal,
    jpFollowTotal, jpSingleOneTotal, sparkAdsTotal, gmvTotal, kbeautyTotal
  };
}

/* ===================== 렌더 ===================== */
function fmt(n){ return Math.round(n).toLocaleString("ko-KR"); }
function pct(used, budget){ return budget>0 ? Math.round(used/budget*100) : 0; }
function chipColors(p){
  if(p>=100) return {bg:"var(--red-bg)", text:"var(--red-text)"};
  if(p>=80) return {bg:"var(--amber-bg)", text:"var(--amber-text)"};
  return {bg:"var(--green-bg)", text:"var(--green-text)"};
}
function pctColor(p){ return chipColors(p).text; }

function amtBarCell(budget, used){
  const p = pct(used, budget);
  const c = chipColors(p);
  return `<div class="amt">${fmt(budget)} / ${fmt(used)} <span class="chip" style="background:${c.bg};color:${c.text}">${p}%</span></div>`;
}
function naCell(label){
  return `<div class="na">${label||"해당 없음"}</div>`;
}

function dayProgressText(month){
  const now = new Date();
  const [y,m] = month.split("-").map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const isCurrentMonth = (now.getFullYear()===y && (now.getMonth()+1)===m);
  const elapsed = isCurrentMonth ? now.getDate() : daysInMonth;
  return { elapsed, daysInMonth, text: `${m}월 ${elapsed}일째 / 총 ${daysInMonth}일` };
}

function render(){
  const month = SELECTED_MONTH;
  const { buckets, special } = aggregateBudget(month);
  const actuals = aggregateActuals(month);
  const dp = dayProgressText(month);
  document.getElementById("dayProgress").textContent = dp.text;

  // 총예산/사용예산 계산
  let totalBudget = 0, totalUsed = 0;
  Object.values(buckets).forEach(v=> totalBudget += v);
  totalBudget += special.gmv + special.sparkAds + special.singleOne + special.follow + special.kbeauty;

  Object.keys(buckets).forEach(key=>{
    const [country, media] = key.split("|");
    let used = 0;
    if(media==="메타"){
      if(country==="미국") used = actuals.usMeta;
      else if(country==="일본") used = actuals.jpMeta;
      else used = actuals.metaRoutineByCountry[country]||0;
    } else if(media==="틱톡"){
      if(country==="미국") used = actuals.usTiktok;
      else if(country==="일본") used = actuals.jpTiktokTotal;
      else used = actuals.tiktokRoutineByCountry[country]||0;
    } else if(media==="구글"){
      used = country==="미국" ? actuals.googleTotal : 0;
    }
    totalUsed += used;
  });
  totalUsed += actuals.jpFollowTotal + actuals.jpSingleOneTotal + actuals.sparkAdsTotal + actuals.gmvTotal + actuals.kbeautyTotal;

  const overallPct = pct(totalUsed, totalBudget);
  const projected = dp.elapsed>0 ? Math.round(totalUsed/dp.elapsed*dp.daysInMonth/totalBudget*100) : 0;

  // 상단 요약
  const projChip = chipColors(projected);
  document.getElementById("topSummary").innerHTML = `
    <div class="card2"><div class="label">총 예산</div><div class="num">${fmt(totalBudget)}</div></div>
    <div class="card2"><div class="label">사용 예산</div><div class="num">${fmt(totalUsed)}</div></div>
    <div class="card2"><div class="label">소진율</div><div class="num" style="color:var(--accent-dark)">${overallPct}%</div></div>
    <div class="card2" style="background:${projChip.bg}"><div class="label" style="color:${projChip.text}">예상 월말 소진율</div><div class="num" style="color:${projChip.text}">${projected}%</div></div>
  `;

  // 채널별 총예산 카드
  let metaBudget=0, metaUsed=0, tiktokBudget=0, tiktokUsed=0, googleBudget=0, googleUsed=0;
  Object.keys(buckets).forEach(key=>{
    const [country, media] = key.split("|");
    const b = buckets[key];
    let used=0;
    if(media==="메타"){
      used = country==="미국"?actuals.usMeta:country==="일본"?actuals.jpMeta:(actuals.metaRoutineByCountry[country]||0);
      metaBudget+=b; metaUsed+=used;
    } else if(media==="틱톡"){
      used = country==="미국"?actuals.usTiktok:country==="일본"?actuals.jpTiktokTotal:(actuals.tiktokRoutineByCountry[country]||0);
      tiktokBudget+=b; tiktokUsed+=used;
    } else if(media==="구글"){
      used = country==="미국"?actuals.googleTotal:0;
      googleBudget+=b; googleUsed+=used;
    }
  });
  const otherBudget = special.sparkAds+special.gmv+special.singleOne+special.follow+special.kbeauty;
  const otherUsed = actuals.sparkAdsTotal+actuals.gmvTotal+actuals.jpSingleOneTotal+actuals.jpFollowTotal+actuals.kbeautyTotal;

  function channelCard(name, b, u){
    const p = pct(u,b), c = chipColors(p);
    return `<div class="card2"><div class="card-title">${name}</div>
      <div class="label">총예산</div><div style="font-size:15px">${fmt(b)}</div>
      <div class="label" style="margin-top:4px">사용예산</div>
      <div style="font-size:15px;display:flex;align-items:center;gap:6px;">${fmt(u)} <span class="chip" style="background:${c.bg};color:${c.text}">${p}%</span></div></div>`;
  }
  document.getElementById("channelCards").innerHTML =
    channelCard("메타", metaBudget, metaUsed) +
    channelCard("틱톡", tiktokBudget, tiktokUsed) +
    channelCard("구글", googleBudget, googleUsed) +
    channelCard("기타", otherBudget, otherUsed);

  // 국가별 예산 비중
  const countryTotals = {};
  Object.keys(buckets).forEach(key=>{
    const [country] = key.split("|");
    countryTotals[country] = (countryTotals[country]||0) + buckets[key];
  });
  const sortedCountries = Object.entries(countryTotals).sort((a,b)=>b[1]-a[1]);
  const grandTotal = sortedCountries.reduce((s,[,v])=>s+v,0);
  document.getElementById("countryShareCard").innerHTML = `<div class="country-grid">` +
    sortedCountries.map(([c,v])=>{
      const p = grandTotal>0 ? Math.round(v/grandTotal*100) : 0;
      return `<div class="country-row"><span>${c}</span><span style="color:var(--muted)">${p}% · ${fmt(v)}</span></div>`;
    }).join("") + `</div>`;

  // 루틴 테이블
  const tierRows = {1:[],2:[],3:[]};
  Object.keys(COUNTRY_TIER).forEach(country=>{
    const metaB = buckets[country+"|메타"]||0;
    const tiktokB = buckets[country+"|틱톡"]||0;
    if(metaB===0 && tiktokB===0) return;
    const metaU = actuals.metaRoutineByCountry[country]||0;
    const tiktokU = actuals.tiktokRoutineByCountry[country]||0;
    const totalB = metaB+tiktokB, totalU = metaU+tiktokU;
    const curPct = pct(totalU, totalB);
    const projPct = dp.elapsed>0 ? Math.round(totalU/dp.elapsed*dp.daysInMonth/totalB*100) : 0;
    tierRows[COUNTRY_TIER[country]].push({country, metaB, metaU, tiktokB, tiktokU, curPct, projPct});
  });
  let routineHtml = "";
  [1,2,3].forEach(tier=>{
    if(tierRows[tier].length===0) return;
    routineHtml += `<tr class="tier-row"><td colspan="5">Tier ${tier}</td></tr>`;
    tierRows[tier].forEach(r=>{
      routineHtml += `<tr class="datarow">
        <td>${r.country}</td>
        <td>${amtBarCell(r.metaB, r.metaU)}</td>
        <td>${amtBarCell(r.tiktokB, r.tiktokU)}</td>
        <td class="pct-r">${r.curPct}%</td>
        <td class="pct-r" style="color:${pctColor(r.projPct)}">${r.projPct}%</td>
      </tr>`;
    });
  });
  document.getElementById("routineTable").innerHTML = routineHtml || `<tr><td colspan="5" class="muted">해당 월 루틴 예산 데이터 없음</td></tr>`;

  // 미국·일본 테이블
  const usMetaB = buckets["미국|메타"]||0, jpMetaB = buckets["일본|메타"]||0;
  const usTiktokB = buckets["미국|틱톡"]||0, jpTiktokB = buckets["일본|틱톡"]||0;
  const usGoogleB = buckets["미국|구글"]||0;
  document.getElementById("usJpTable").innerHTML = `
    <tr class="datarow">
      <td>미국</td>
      <td>${amtBarCell(usMetaB, actuals.usMeta)}</td>
      <td>${amtBarCell(usTiktokB, actuals.usTiktok)}</td>
      <td>${amtBarCell(usGoogleB, actuals.googleTotal)}</td>
      <td>${naCell()}</td>
      <td>${naCell()}</td>
    </tr>
    <tr class="datarow">
      <td>일본</td>
      <td>${amtBarCell(jpMetaB, actuals.jpMeta)}</td>
      <td>${amtBarCell(jpTiktokB, actuals.jpTiktokTotal)}</td>
      <td>${naCell()}</td>
      <td>${amtBarCell(special.follow, actuals.jpFollowTotal)}</td>
      <td>${amtBarCell(special.singleOne, actuals.jpSingleOneTotal)}</td>
    </tr>
  `;

  // 개별 운영 항목
  function standaloneCard(name, b, u){
    const p = pct(u,b), c = chipColors(p);
    return `<div class="card2"><div class="card-title">${name}</div>
      <div class="label">예산</div><div style="font-size:14px">${fmt(b)}</div>
      <div class="label" style="margin-top:4px">소진</div>
      <div style="font-size:14px;display:flex;align-items:center;gap:6px;">${fmt(u)} <span class="chip" style="background:${c.bg};color:${c.text}">${p}%</span></div></div>`;
  }
  document.getElementById("standaloneCards").innerHTML =
    standaloneCard("스파크애즈", special.sparkAds, actuals.sparkAdsTotal) +
    standaloneCard("틱톡 GMV", special.gmv, actuals.gmvTotal) +
    standaloneCard("K뷰티캔디", special.kbeauty, actuals.kbeautyTotal);

  // 소진 알림 (단순 규칙: 전체 소진율 기준 상위 과속/저속 항목 표시)
  const allItems = [];
  tierRows[1].concat(tierRows[2]).concat(tierRows[3]).forEach(r=>{
    if(r.metaB>0) allItems.push({label:`${r.country} 메타`, pct: pct(r.metaU,r.metaB)});
    if(r.tiktokB>0) allItems.push({label:`${r.country} 틱톡`, pct: pct(r.tiktokU,r.tiktokB)});
  });
  allItems.push({label:"스파크애즈", pct: pct(actuals.sparkAdsTotal, special.sparkAds)});
  allItems.push({label:"GMV", pct: pct(actuals.gmvTotal, special.gmv)});
  allItems.push({label:"K뷰티캔디", pct: pct(actuals.kbeautyTotal, special.kbeauty)});
  const overPacing = allItems.filter(i=>i.pct>=100).sort((a,b)=>b.pct-a.pct).slice(0,1);
  const nearLimit = allItems.filter(i=>i.pct>=80 && i.pct<100).sort((a,b)=>b.pct-a.pct).slice(0,1);
  const underPacing = allItems.filter(i=>i.pct>0 && i.pct<40).sort((a,b)=>a.pct-b.pct).slice(0,1);
  let alertsHtml = "";
  overPacing.forEach(i=> alertsHtml += `<div class="alert alert-danger">${i.label} ${i.pct}% 초과</div>`);
  nearLimit.forEach(i=> alertsHtml += `<div class="alert alert-warning">${i.label} ${i.pct}% · 소진 임박</div>`);
  underPacing.forEach(i=> alertsHtml += `<div class="alert alert-muted">${i.label} ${i.pct}% · 소진 저조</div>`);
  document.getElementById("alerts").innerHTML = alertsHtml || `<div class="alert alert-muted">특이사항 없음</div>`;
}

init();
</script>
</body>
</html>
