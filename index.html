<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mary&May 광고비 대시보드</title>
<style>
  :root{
    --bg:#F7F5F0; --card:#FFFFFF; --border:#E7E3D9; --text:#2C2C2A; --text-sub:#6B6A63; --text-mute:#9B9A93;
    --accent:#D85A30; --accent-bg:#FAECE7;
    --tiktok:#0F6E56; --meta:#534AB7; --google:#993C1D;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
  }
  .wrap{max-width:1200px; margin:0 auto; padding:20px;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;
  }
  .topbar h1{font-size:18px; font-weight:700; margin:0;}
  .topbar .sub{color:var(--text-sub); font-size:12px;}
  button.tab-btn{
    border:1px solid var(--border); background:var(--card); color:var(--text-sub);
    padding:6px 14px; border-radius:20px; font-size:13px; cursor:pointer; font-weight:600;
  }
  button.tab-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .refresh-btn{
    border:1px solid var(--border); background:var(--card); padding:8px 14px; border-radius:8px;
    font-size:13px; cursor:pointer; color:var(--text);
  }
  .refresh-btn:hover{background:var(--accent-bg); border-color:var(--accent);}
  .filter-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
  .month-btn{
    border:1px solid var(--border); background:var(--card); color:var(--text-sub);
    padding:5px 12px; border-radius:8px; font-size:12px; cursor:pointer; font-weight:600;
  }
  .month-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .kpi-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px; margin-bottom:20px;
  }
  .kpi-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
  .kpi-card .label{font-size:12px; color:var(--text-sub); margin-bottom:4px;}
  .kpi-card .value{font-size:20px; font-weight:700; margin-bottom:6px;}
  .kpi-card .breakdown{font-size:11px; color:var(--text-sub); margin:1px 0;}
  .kpi-card .breakdown .tag{color:var(--text-mute); margin-right:3px;}
  .box-row{display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-bottom:24px;}
  @media (max-width:700px){ .box-row{grid-template-columns:repeat(2,1fr);} }
  .box{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px;}
  .box .head{font-size:13px; font-weight:700; margin-bottom:2px; display:flex; align-items:center; gap:6px;}
  .box .dot{width:8px; height:8px; border-radius:2px; display:inline-block;}
  .box .sub{font-size:11px; color:var(--text-sub); margin-bottom:8px;}
  .box table{width:100%; font-size:12px; border-collapse:collapse;}
  .box table td{padding:3px 2px;}
  .box table td:last-child{text-align:right;}
  .box table td.label{color:var(--text-sub);}
  .box table td.dim{color:var(--text-mute);}
  .box.total{background:#FAF8F2; border-color:#DED8C8;}
  section.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:20px;}
  section.card > .title{font-size:13px; color:var(--text-sub); margin-bottom:12px; font-weight:600;}
  .region-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px;}
  .region-badge{
    border-radius:var(--radius); padding:12px; cursor:pointer; border:2px solid transparent; transition:transform .1s;
  }
  .region-badge:hover{transform:translateY(-1px);}
  .region-badge.selected{border-color:var(--text);}
  .region-badge .name{font-weight:700; font-size:13px; margin-bottom:2px;}
  .region-badge .amt{font-size:12px; opacity:.85;}
  .region-detail-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:10px; margin-top:14px;}
  .country-row{display:flex; justify-content:space-between; font-size:12px; padding:4px 2px; border-bottom:1px solid var(--border);}
  .country-row:last-child{border-bottom:none;}
  .country-row .name{color:var(--text);}
  .country-row .amt{color:var(--text-sub); text-align:right;}
  .warn-box{background:#FFF7E8; border:1px solid #F0D89A; border-radius:8px; padding:10px 14px; font-size:12px; color:#7A5B10; margin-bottom:16px;}
  .filter-pill-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .pill{border:1px solid var(--border); background:var(--card); padding:5px 12px; border-radius:20px; font-size:12px; cursor:pointer; color:var(--text-sub); font-weight:600;}
  .pill.active{background:var(--text); border-color:var(--text); color:#fff;}
  .compare-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:700px){ .compare-grid{grid-template-columns:1fr;} }
  .compare-box{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px;}
  .compare-box .month-label{font-size:13px; font-weight:700; margin-bottom:8px;}
  table.detail{width:100%; font-size:11px; border-collapse:collapse;}
  table.detail th{text-align:right; color:var(--text-sub); font-weight:600; padding:3px 2px; border-bottom:1px solid var(--border);}
  table.detail th:first-child{text-align:left;}
  table.detail td{padding:3px 2px; text-align:right;}
  table.detail td:first-child{text-align:left;}
  .loading{padding:40px; text-align:center; color:var(--text-sub);}
  a.back-link{font-size:13px; color:var(--accent); cursor:pointer; text-decoration:none; font-weight:600;}
  .page{display:none;}
  .page.active{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>Mary&May 광고비 대시보드</h1>
      <div class="sub" id="last-updated">데이터 불러오는 중…</div>
    </div>
    <button class="refresh-btn" id="refresh-btn">↻ 새로고침</button>
  </div>

  <div id="warn-area"></div>

  <!-- MAIN PAGE -->
  <div class="page active" id="page-main">
    <div class="filter-row">
      <div id="month-filter"></div>
    </div>

    <div class="kpi-grid" id="kpi-grid"></div>

    <div class="box-row" id="box-row"></div>

    <section class="card">
      <div class="title">권역별 예산 비중</div>
      <div id="world-map-wrap" style="margin-bottom:16px;"></div>
      <div class="region-grid" id="region-grid"></div>
      <div class="region-detail-grid" id="region-detail"></div>
    </section>

    <button class="refresh-btn" id="goto-country">국가별 보기 →</button>
  </div>

  <!-- COUNTRY SUBPAGE -->
  <div class="page" id="page-country">
    <a class="back-link" id="back-to-main">← 메인으로</a>
    <h2 style="font-size:16px; margin:12px 0;">국가별 상세</h2>
    <div class="filter-pill-row" id="country-region-filter"></div>
    <div class="filter-row">
      <label style="font-size:12px; color:var(--text-sub); margin-right:6px;">기준월</label>
      <select id="month-select" style="padding:6px 10px; border-radius:8px; border:1px solid var(--border);"></select>
    </div>
    <div class="compare-grid" id="compare-grid"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const SPREADSHEET_ID = "1-gZrBKjTlxhc6VCJWsFDjM6epwaGvGP5q81Dadx8SP8";
const GIDS = { 틱톡:0, 틱톡아랍:703547167, 틱톡라탐:1724510644, 메타:1252891778, 구글:1157043789 };

const CSV_URLS = Object.fromEntries(Object.entries(GIDS).map(([k,g]) => [k, gvizUrl(g)]));

const CHANNEL_COLOR = { 틱톡:"#0F6E56", 메타:"#534AB7", 구글:"#993C1D" };

const ISO_NAME = {
  PL:"폴란드",KH:"캄보디아",EG:"이집트",AU:"호주",TR:"터키",AE:"아랍에미리트",VN:"베트남",ID:"인도네시아",

  DZ:"알제리",TN:"튀니지",MY:"말레이시아",TH:"태국",PH:"필리핀",SG:"싱가포르",IN:"인도",PK:"파키스탄",

// gviz(구글 시각화 API) 응답에서 날짜 타입 셀은 "Date(2026,0,1)" 형식(월은 0부터 시작)으로 내려오는
// 경우가 있음 — 이걸 일반 "YYYY-MM-DD" 문자열로 정규화.
function normalizeDate(v){
  if(!v) return v;
  const s = String(v);
  const m = s.match(/^Date\((\d+),\s*(\d+),\s*(\d+)/);
  if(m){
    const y = m[1], mo = String(parseInt(m[2],10)+1).padStart(2,"0"), d = String(parseInt(m[3],10)).padStart(2,"0");
    return `${y}-${mo}-${d}`;
  }
  return s;
}

  "베트남":"동남아", "인도네시아":"동남아", "말레이시아":"동남아", "캄보디아":"동남아", "필리핀":"동남아", "태국":"동남아", "싱가포르":"동남아",

  "사우디아라비아":"중동", "아랍에미리트":"중동", "쿠웨이트":"중동", "이집트":"중동", "카타르":"중동", "이라크":"중동",
  "요르단":"중동", "레바논":"중동", "바레인":"중동", "오만":"중동", "모로코":"중동", "알제리":"중동", "튀니지":"중동", "이스라엘":"중동",

  "터키":"유럽", "폴란드":"유럽", "이탈리아":"유럽", "영국":"유럽", "그리스":"유럽", "체코":"유럽", "루마니아":"유럽",
  "우크라이나":"유럽", "카자흐스탄":"유럽", "프랑스":"유럽", "스페인":"유럽", "독일":"유럽", "네덜란드":"유럽", "벨기에":"유럽", "포르투갈":"유럽",
  "스웨덴":"유럽", "덴마크":"유럽", "조지아":"유럽", "노르웨이":"유럽", "핀란드":"유럽", "스위스":"유럽", "오스트리아":"유럽", "아일랜드":"유럽", "헝가리":"유럽", "불가리아":"유럽", "키르기스스탄":"유럽",

  "칠레":"남미", "아르헨티나":"남미", "페루":"남미", "콜롬비아":"남미", "코스타리카":"남미", "멕시코":"남미", "파라과이":"남미", "푸에르토리코":"남미", "브라질":"남미",

  "미국":"북미", "캐나다":"북미",

  "일본":"아시아", "인도":"아시아", "파키스탄":"아시아", "방글라데시":"아시아", "대만":"아시아", "홍콩":"아시아",

  "나이지리아":"기타", "남아공":"기타",
};
function regionOf(country){ return COUNTRY_REGION[country] || "기타"; }
function regionOfRow(r){ return r.region || regionOf(r.country); }

// 국가 한글명 -> ISO-3166-1 숫자코드 (world-atlas topojson과 매칭용)
// 국가 티어 (마케팅 우선순위 등급)
const COUNTRY_TIER = {
  "미국":1, "일본":1, "브라질":1, "사우디아라비아":1,
  "베트남":2, "터키":2, "폴란드":2, "독일":2, "프랑스":2, "멕시코":2,
  "홍콩":3, "캄보디아":3, "조지아":3, "영국":3, "체코":3, "칠레":3, "파라과이":3, "아랍에미리트":3, "호주":3, "이집트":3, "이스라엘":3,
};
const TIER_COLOR = {1:"#D85A30", 2:"#0F6E56", 3:"#534AB7"};

const COUNTRY_NUMERIC = {
  "베트남":"704","인도네시아":"360","말레이시아":"458","캄보디아":"116","필리핀":"608","태국":"764","싱가포르":"702",
  "사우디아라비아":"682","아랍에미리트":"784","쿠웨이트":"414","이집트":"818","카타르":"634","이라크":"368","요르단":"400",
  "레바논":"422","바레인":"48","모로코":"504","알제리":"12","튀니지":"788","이스라엘":"376",
  "터키":"792","폴란드":"616","이탈리아":"380","영국":"826","그리스":"300","체코":"203","루마니아":"642","우크라이나":"804",
  "카자흐스탄":"398","프랑스":"250","스페인":"724","독일":"276","네덜란드":"528","벨기에":"56","포르투갈":"620","스웨덴":"752",
  "덴마크":"208","조지아":"268","노르웨이":"578","핀란드":"246","스위스":"756","오스트리아":"40","아일랜드":"372","헝가리":"348","불가리아":"100",
  "칠레":"152","아르헨티나":"32","페루":"604","콜롬비아":"170","코스타리카":"188","멕시코":"484","파라과이":"600","푸에르토리코":"630","브라질":"76",
  "미국":"840","캐나다":"124",
  "일본":"392","인도":"356","파키스탄":"586","방글라데시":"50","대만":"158","홍콩":"344",
  "나이지리아":"566","남아공":"710","호주":"36","키르기스스탄":"417",
};
const NUMERIC_TO_COUNTRY = Object.fromEntries(Object.entries(COUNTRY_NUMERIC).map(([k,v])=>[v,k]));

let worldTopo = null;
async function ensureWorldTopo(){
  if(worldTopo) return worldTopo;
  const res = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
  worldTopo = await res.json();
  return worldTopo;
}

async function renderWorldMap(byCountrySpend, totalSpend){
  const wrap = document.getElementById("world-map-wrap");
  try{
    if(typeof d3 === "undefined") throw new Error("d3 라이브러리 로드 실패");
    if(typeof topojson === "undefined") throw new Error("topojson-client 라이브러리 로드 실패");
    const topo = await ensureWorldTopo();

    const width = wrap.clientWidth || 900, height = Math.round(width*0.5);
    wrap.innerHTML = "";
    const svg = d3.select(wrap).append("svg").attr("viewBox", `0 0 ${width} ${height}`).style("width","100%").style("height","auto");
    const projection = d3.geoNaturalEarth1().fitSize([width, height], topojson.feature(topo, topo.objects.countries));
    const path = d3.geoPath(projection);
    const countries = topojson.feature(topo, topo.objects.countries).features;

    const tooltip = d3.select(wrap).append("div")
      .style("position","absolute").style("pointer-events","none").style("background","#2C2C2A").style("color","#fff")
      .style("padding","4px 8px").style("border-radius","6px").style("font-size","11px").style("opacity",0).style("z-index",10);
    wrap.style.position = "relative";

    svg.selectAll("path")
      .data(countries)
      .join("path")
      .attr("d", path)
      .attr("fill", d => {
        const name = NUMERIC_TO_COUNTRY[String(d.id)];
        if(!name) return "#EDEAE1";
        const reg = regionOf(name);
        return REGION_BG[reg] || "#EDEAE1";
      })
      .attr("stroke", "#fff").attr("stroke-width", 0.5)
      .style("cursor","pointer")
      .on("mousemove", function(evt, d){
        const name = NUMERIC_TO_COUNTRY[String(d.id)];
        const spend = name ? (byCountrySpend[name]||0) : 0;
        if(!name || !spend){ tooltip.style("opacity",0); return; }
        const p = spend/totalSpend*100;
        const rect = wrap.getBoundingClientRect();
        tooltip.style("opacity",1)
          .html(`<b>${name}</b><br>${fmt(spend)} · ${p.toFixed(1)}%`)
          .style("left", (evt.clientX-rect.left+10)+"px")
          .style("top", (evt.clientY-rect.top+10)+"px");
      })
      .on("mouseleave", ()=>tooltip.style("opacity",0))
      .on("click", function(evt, d){
        const name = NUMERIC_TO_COUNTRY[String(d.id)];
        if(name){ selectedRegion = regionOf(name); renderRegions(); }
      });

    // 티어 국가는 항상 라벨 표시(티어별 크기 차등), 남는 자리는 지출 상위 국가로 보완
    const MAX_LABELS = 18;
    const tierEntries = Object.keys(COUNTRY_TIER)
      .filter(c => (byCountrySpend[c]||0) > 0 && COUNTRY_NUMERIC[c])
      .sort((a,b) => COUNTRY_TIER[a]-COUNTRY_TIER[b]);
    const topSpendFill = Object.entries(byCountrySpend)
      .filter(([c,v]) => v > 0 && COUNTRY_NUMERIC[c] && !COUNTRY_TIER[c])
      .sort((a,b) => b[1]-a[1])
      .map(([c]) => c);
    const labelCountries = [...tierEntries, ...topSpendFill].slice(0, MAX_LABELS);
    const topSet = new Set(labelCountries);
    const labelFeatures = countries.filter(d => topSet.has(NUMERIC_TO_COUNTRY[String(d.id)]));

    // 지출 상위/티어 국가 라벨 좌표 계산
    const labelPoints = labelFeatures.map(d => {
      const name = NUMERIC_TO_COUNTRY[String(d.id)];
      const [x,y] = path.centroid(d);
      return { name, x, y };
    }).filter(p => isFinite(p.x) && isFinite(p.y));

    // 가까운 점끼리 클러스터로 묶기
    function clusterPoints(pts, threshold){
      const used = new Array(pts.length).fill(false);
      const clusters = [];
      for(let i=0;i<pts.length;i++){
        if(used[i]) continue;
        const cluster = [pts[i]]; used[i]=true;
        for(let j=i+1;j<pts.length;j++){
          if(used[j]) continue;
          const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
          if(Math.sqrt(dx*dx+dy*dy) < threshold){ cluster.push(pts[j]); used[j]=true; }
        }
        clusters.push(cluster);
      }
      return clusters;
    }
    const clusters = clusterPoints(labelPoints, 30);

    // 클러스터가 2개 이상이면 겹치니까 위쪽으로 펼쳐서 인출선으로 연결 (4개 이상이면 2열로)
    const placed = [];
    clusters.forEach(cluster => {
      if(cluster.length === 1){
        placed.push({...cluster[0], lx:cluster[0].x, ly:cluster[0].y, leader:false});
        return;
      }
      const cx = d3.mean(cluster, p=>p.x), topY = d3.min(cluster, p=>p.y);
      const anchorY = topY - 46;
      const sorted = [...cluster].sort((a,b) => (COUNTRY_TIER[a.name]||9) - (COUNTRY_TIER[b.name]||9));
      const twoCol = sorted.length >= 4;
      sorted.forEach((p, i) => {
        const col = twoCol ? (i % 2) : 0;
        const row = twoCol ? Math.floor(i/2) : i;
        const lx = twoCol ? cx + (col===0 ? -58 : 58) : cx;
        const ly = anchorY - row*32;
        placed.push({...p, lx, ly, leader:true});
      });
    });

    const FONT_SIZE = { 1:{name:14, amt:11}, 2:{name:11.5, amt:9.5}, 3:{name:10, amt:8.5}, none:{name:9.5, amt:8} };
    function sizeFor(name){ const t = COUNTRY_TIER[name]; return FONT_SIZE[t] || FONT_SIZE.none; }

    // 인출선
    svg.selectAll("line.leader")
      .data(placed.filter(p=>p.leader))
      .join("line")
      .attr("class","leader")
      .attr("x1", p=>p.x).attr("y1", p=>p.y)
      .attr("x2", p=>p.lx).attr("y2", p=>p.ly)
      .attr("stroke", "#999").attr("stroke-width", 0.8);

    const labelGroup = svg.selectAll("g.map-label")
      .data(placed)
      .join("g")
      .attr("class","map-label")
      .attr("transform", p => `translate(${p.lx},${p.ly})`)
      .style("pointer-events","none");

    labelGroup.append("text")
      .attr("text-anchor","middle")
      .attr("dy","-2px")
      .style("font-size", p => sizeFor(p.name).name + "px")
      .style("font-weight","700")
      .style("paint-order","stroke").style("stroke","#fff").style("stroke-width","3px")
      .style("fill","#2C2C2A")
      .text(p => (COUNTRY_TIER[p.name] ? `[T${COUNTRY_TIER[p.name]}] ` : "") + p.name);

    labelGroup.append("text")
      .attr("text-anchor","middle")
      .attr("dy", p => sizeFor(p.name).amt + "px")
      .style("font-size", p => sizeFor(p.name).amt + "px")
      .style("paint-order","stroke").style("stroke","#fff").style("stroke-width","3px")
      .style("fill","#6B6A63")
      .text(p => {
        const v = byCountrySpend[p.name] || 0;
        return fmt(v) + " · " + (v/totalSpend*100).toFixed(1) + "%";
      });
  }catch(e){
    wrap.innerHTML = `<div style="padding:16px; font-size:12px; color:var(--text-sub); background:#FCEBEB; border-radius:8px;">지도 렌더링 실패: ${e.message}</div>`;
  }
}

function normalizeCountry(raw){
  if(!raw) return raw;
  let t = String(raw).trim();
  if(ISO_NAME[t]) return ISO_NAME[t];
  if(COUNTRY_ALIAS[t]) return COUNTRY_ALIAS[t];
  const lower = t.replace(/,/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
  if(ENGLISH_NAME[lower]) return ENGLISH_NAME[lower];
  return t; // 이미 한글 국가명이거나, 매핑 안 된 값은 그대로
}
function isUnknownValue(raw){
  if(!raw) return true;
  return String(raw).trim().toLowerCase() === "unknown";
}

function regionFromNames(names){
  const counts = {};
  names.forEach(n => { const r = COUNTRY_REGION[n]; if(r) counts[r]=(counts[r]||0)+1; });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  return entries.length ? entries[0][0] : "기타";
}

// 캠페인명 하나에서 {country, region} 을 뽑아낸다. 못 찾으면 null.
function parseCountryInfo(campaign){
  if(!campaign) return null;

  // 1) "(Arabic강)", "(Arabic약)", "(Arabic)", "(Latam강)", "(Latam약)" — 구체 국가 없는 권역 플레이스홀더
  let m = campaign.match(/\((Arabic|Latam)(강|약)?\)/i);
  if(m){
    const region = m[1].toLowerCase()==="arabic" ? "중동" : "남미";
    return { country: (m[1]==="Arabic"?"아랍권":"라틴아메리카") + " 통합집행(세부미분류)", region };
  }

  // 2) "[강 - SA UAE]" / "[약 - KU QA EG]" / 라탐탭의 "[강 - MX CL PR]" 등 코드 나열형 통합집행
  m = campaign.match(/\[(?:강|약)\s*-\s*([A-Z]+(?:\s+[A-Z]+)*)\]/);
  if(m){
    const codes = m[1].trim().split(/\s+/);
    const names = codes.map(c => normalizeCountry(c));
    const region = regionFromNames(names);
    return { country: names.join("+") + "(통합집행)", region };
  }

  // 3) "_02(베트남)_" 또는 "11월 01(이라크)_" 처럼 숫자+괄호 붙는 표준 패턴
  m = campaign.match(/\d+\s*\(([^)]+)\)/);
  if(m){
    const country = normalizeCountry(m[1]);
    return { country, region: regionOf(country) };
  }

  // 4) "(국가명)_[" 패턴 — 알려진 국가/코드일 때만 인정 (아니면 쓰레기값 방지)
  m = campaign.match(/\(([^)]+)\)_\[/);
  if(m){
    const country = normalizeCountry(m[1]);
    if(COUNTRY_REGION[country] || ISO_NAME[m[1]]) return { country, region: regionOf(country) };
  }

  // 5) 레거시: 괄호 없이 국가명이 텍스트 중간에 그대로 들어간 경우
  const known = Object.keys(COUNTRY_REGION);
  for(const c of known){
    if(campaign.includes(c)) return { country:c, region:regionOf(c) };
  }

  return null;
}

function parseTikTok(csvText, subTag){
  const parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
  const rows = [];
  const UNKNOWN_SEEN = new Set();
  parsed.data.forEach(r => {
    // 새 포맷: 계정 이름, 캠페인 이름, 광고 그룹 이름, 광고 이름, 일별, 국가/지역, 지출, 노출수, 클릭수(목적지), ...
    const date = normalizeDate(r["일별"]);
    const spend = num(r["지출"]);
    const impr = num(r["노출수"]);
    const clicks = num(r["클릭수(목적지)"]);
    const rawCountry = r["국가/지역"];
    if(!date) return;

    let country;
    if(isUnknownValue(rawCountry)){
      UNMATCHED.push({channel:"틱톡", sub:subTag, campaign:r["캠페인 이름"]||"", spend});
      country = "미분류";
    } else {
      country = normalizeCountry(rawCountry);
      const dedupKey = country.toLowerCase();
      if(!COUNTRY_REGION[country] && !UNKNOWN_SEEN.has(dedupKey)){
        UNKNOWN_SEEN.add(dedupKey);
        UNMAPPED_COUNTRIES.push({channel:"틱톡", sub:subTag, raw:rawCountry, resolved:country});
      }
    }
    rows.push({channel:"틱톡", country, date, spend, impr, clicks});
  });
  return rows;
}

function parseMeta(csvText){
  const parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
  const rows = [];
  parsed.data.forEach(r => {
    const date = normalizeDate(r["일"]);
    const countryCode = r["국가"];
    const spend = num(r["지출 금액 (KRW)"]);
    const impr = num(r["노출"]);
    const clicks = num(r["링크 클릭"] || r["클릭(전체)"]);
    if(!date) return;
    const country = isUnknownValue(countryCode) ? "미분류" : normalizeCountry(countryCode);
    rows.push({channel:"메타", country, date, spend, impr, clicks});
  });
  return rows;
}

function parseGoogle(csvText){
  const parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
  const rows = [];
  parsed.data.forEach(r => {
    const date = normalizeDate(r["일"]);
    const spend = num(r["비용"]);
    const impr = num(r["노출수"]);
    const clicks = num(r["클릭수"]);
    const adType = r["광고 유형"] || "기타";
    if(!date) return;
    if(spend===0 && impr===0 && clicks===0) return;
    rows.push({channel:"구글", country:"미국", date, spend, impr, clicks, adType});
  });
  return rows;
}

async function loadAll(force){
  document.getElementById("last-updated").textContent = "데이터 불러오는 중…";
  ALL_ROWS = [];
  UNMATCHED = [];
  UNMAPPED_COUNTRIES = [];
  const FETCH_ERRORS = [];
  const bust = force ? ("&_="+Date.now()) : "";
  const entries = Object.entries(CSV_URLS);
  const results = await Promise.all(entries.map(async ([name,u]) => {
    try{
      const res = await fetch(u+bust);
      if(!res.ok) throw new Error("HTTP "+res.status);
      const text = await res.text();
      if(!text || text.length < 5) throw new Error("빈 응답");
      return text;
    }catch(e){
      FETCH_ERRORS.push(name+": "+e.message);
      return "";
    }
  }));
  const [tt, tta, ttl, meta, google] = results;
  try{
    ALL_ROWS = ALL_ROWS.concat(
      parseTikTok(tt, "본사"),
      parseTikTok(tta, "아랍"),
      parseTikTok(ttl, "라탐"),
      parseMeta(meta),
      parseGoogle(google)
    );
  }catch(e){
    FETCH_ERRORS.push("파싱 오류: "+e.message);
  }
  document.getElementById("last-updated").textContent = "마지막 갱신: " + new Date().toLocaleString("ko-KR") + (FETCH_ERRORS.length ? " (일부 실패)" : "");
  renderWarnings(FETCH_ERRORS);
  renderAll();
}

function renderWarnings(fetchErrors){
  const area = document.getElementById("warn-area");
  let html = "";
  if(fetchErrors && fetchErrors.length){
    html += `<div class="warn-box" style="background:#FCEBEB; border-color:#F0999; color:#791F1F;">⚠ 시트 불러오기 실패: ${fetchErrors.join(" / ")}<br>CORS나 시트 공개설정 문제일 수 있습니다. 시트가 "링크가 있는 모든 사용자에게 공개"로 설정되어 있는지 확인해주세요.</div>`;
  }
  if(UNMATCHED.length > 0){
    const totalSpend = UNMATCHED.reduce((a,b)=>a+b.spend,0);
    const samples = Array.from(new Set(UNMATCHED.map(u=>u.campaign))).slice(0,5);
    html += `<div class="warn-box">⚠ 국가/지역 값이 비어있는 행이 ${UNMATCHED.length}건 있습니다 (지출 합계 ${fmt(totalSpend)}원).<br>샘플 캠페인명: ${samples.map(s=>`<code style="font-size:10px;">${s}</code>`).join(" · ")}</div>`;
  }
  if(UNMAPPED_COUNTRIES.length > 0){
    const list = UNMAPPED_COUNTRIES.map(u=>`"${u.raw}"→${u.resolved}`).join(", ");
    html += `<div class="warn-box">ℹ 사전에 없는 국가값이 있어 "기타"로 분류됩니다: ${list}<br>알려주시면 매핑표에 추가할게요.</div>`;
  }
  area.innerHTML = html;
}

function getMonthKey(dateStr){
  return dateStr ? dateStr.slice(0,7) : null; // YYYY-MM
}

let selectedMonth = null; // null = 전체, else "YYYY-MM"

function monthList(){
  const set = new Set(ALL_ROWS.map(r=>getMonthKey(r.date)).filter(Boolean));
  return Array.from(set).sort();
}

function filteredRows(monthKey){
  if(!monthKey) return ALL_ROWS;
  return ALL_ROWS.filter(r => getMonthKey(r.date) === monthKey);
}

function renderMonthFilter(){
  const months = monthList();
  const box = document.getElementById("month-filter");
  box.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "month-btn" + (selectedMonth===null ? " active":"");
  allBtn.textContent = "전체";
  allBtn.onclick = () => { selectedMonth = null; renderAll(); };
  box.appendChild(allBtn);
  months.forEach(m => {
    const b = document.createElement("button");
    b.className = "month-btn" + (selectedMonth===m ? " active":"");
    b.textContent = m.slice(5,7)+"월";
    b.onclick = () => { selectedMonth = (selectedMonth===m ? null : m); renderAll(); };
    box.appendChild(b);
  });
}

function renderKpis(){
  const rows = filteredRows(selectedMonth);
  const channels = ["틱톡","메타","구글"];
  const byChannel = {};
  channels.forEach(ch => {
    const cr = rows.filter(r=>r.channel===ch);
    byChannel[ch] = {
      spend: cr.reduce((a,b)=>a+b.spend,0),
      impr: cr.reduce((a,b)=>a+b.impr,0),
      clicks: cr.reduce((a,b)=>a+b.clicks,0),
    };
  });
  const total = {
    spend: channels.reduce((a,ch)=>a+byChannel[ch].spend,0),
    impr: channels.reduce((a,ch)=>a+byChannel[ch].impr,0),
    clicks: channels.reduce((a,ch)=>a+byChannel[ch].clicks,0),
  };
  const cpc = total.clicks ? total.spend/total.clicks : null;
  const ctr = total.impr ? total.clicks/total.impr*100 : null;
  const cpm = total.impr ? total.spend/total.impr*1000 : null;

  const grid = document.getElementById("kpi-grid");
  grid.innerHTML = "";

  function card(label, mainVal, breakdownFn){
    const div = document.createElement("div");
    div.className = "kpi-card";
    let html = `<div class="label">${label}</div><div class="value">${mainVal}</div>`;
    channels.forEach(ch => {
      html += `<div class="breakdown"><span class="tag">ㄴ</span>${ch}: ${breakdownFn(ch)}</div>`;
    });
    div.innerHTML = html;
    return div;
  }

  grid.appendChild(card("총 지출 (KRW)", fmt(total.spend), ch=>fmt(byChannel[ch].spend)));
  grid.appendChild(card("노출", fmt(total.impr), ch=>fmt(byChannel[ch].impr)));
  grid.appendChild(card("링크 클릭", fmt(total.clicks), ch=>fmt(byChannel[ch].clicks)));
  grid.appendChild(card("CPC", fmt(cpc), ch=>{ const d=byChannel[ch]; return d.clicks? fmt(d.spend/d.clicks):"–"; }));
  grid.appendChild(card("CTR", pct(ctr), ch=>{ const d=byChannel[ch]; return d.impr? pct(d.clicks/d.impr*100):"–"; }));
  grid.appendChild(card("CPM", fmt(cpm), ch=>{ const d=byChannel[ch]; return d.impr? fmt(d.spend/d.impr*1000):"–"; }));
}

  });
  totalBox.innerHTML = `<div class="head">월별 합산</div><div class="sub">합계 ${fmt(grand)}</div><table>${rowsHtml}</table>`;
  row.appendChild(totalBox);

let selectedRegion = null;

function renderRegions(){
  const rows = filteredRows(selectedMonth);
  const byRegion = {};
  rows.forEach(r => {
    const reg = regionOfRow(r);
    byRegion[reg] = byRegion[reg] || {spend:0, countries:{}};
    byRegion[reg].spend += r.spend;
    byRegion[reg].countries[r.country] = (byRegion[reg].countries[r.country]||0) + r.spend;
  });
  const totalSpend = Object.values(byRegion).reduce((a,b)=>a+b.spend,0) || 1;

  const byCountrySpend = {};
  rows.forEach(r => { byCountrySpend[r.country] = (byCountrySpend[r.country]||0) + r.spend; });
  renderWorldMap(byCountrySpend, totalSpend);

  const grid = document.getElementById("region-grid");
  grid.innerHTML = "";
  Object.entries(byRegion).sort((a,b)=>b[1].spend-a[1].spend).forEach(([reg, data]) => {
    const p = data.spend/totalSpend*100;
    const badge = document.createElement("div");
    badge.className = "region-badge" + (selectedRegion===reg ? " selected":"");
    badge.style.background = REGION_BG[reg] || "#eee";
    badge.innerHTML = `<div class="name" style="color:${REGION_COLOR[reg]||'#333'}">${reg}</div><div class="amt" style="color:${REGION_COLOR[reg]||'#333'}">${fmt(data.spend)} · ${p.toFixed(1)}%</div>`;
    badge.onclick = () => { selectedRegion = (selectedRegion===reg? null:reg); renderRegions(); };
    grid.appendChild(badge);
  });

  const detailWrap = document.getElementById("region-detail");
  detailWrap.innerHTML = "";
  const regionsToShow = selectedRegion ? [selectedRegion] : Object.keys(byRegion);
  regionsToShow.forEach(reg => {
    const data = byRegion[reg];
    if(!data) return;
    const box = document.createElement("div");
    box.className = "box";
    const countryRows = Object.entries(data.countries).sort((a,b)=>b[1]-a[1]).map(([c,v]) => {
      const p = totalSpend ? (v/totalSpend*100) : 0;
      const tier = COUNTRY_TIER[c];
      const tierBadge = tier ? `<span style="display:inline-block; font-size:9px; font-weight:700; padding:1px 5px; border-radius:8px; margin-right:5px; background:${TIER_COLOR[tier]}1A; color:${TIER_COLOR[tier]};">T${tier}</span>` : "";
      return `<div class="country-row"><span class="name">${tierBadge}${c}</span><span class="amt">${fmt(v)} · ${p.toFixed(1)}%</span></div>`;
    }).join("");
    box.innerHTML = `<div class="head" style="color:${REGION_COLOR[reg]}"><span class="dot" style="background:${REGION_COLOR[reg]}"></span>${reg}</div><div class="sub">합계 ${fmt(data.spend)}</div>${countryRows}`;
    detailWrap.appendChild(box);
  });
}

function renderAll(){
  renderMonthFilter();
  renderKpis();
  renderBoxes();
  renderRegions();
  renderCountryPage();
}

// ===== 국가별 서브페이지 =====
let countryRegionFilter = "전체";

function renderCountryRegionFilter(){
  const regions = ["전체", ...Object.keys(REGION_COLOR)];
  const wrap = document.getElementById("country-region-filter");
  wrap.innerHTML = "";
  regions.forEach(r => {
    const b = document.createElement("button");
    b.className = "pill" + (countryRegionFilter===r ? " active":"");
    b.textContent = r;
    b.onclick = () => { countryRegionFilter = r; renderCountryPage(); };
    wrap.appendChild(b);
  });
}

function renderMonthSelect(){
  const sel = document.getElementById("month-select");
  const months = monthList();
  const prevVal = sel.value;
  sel.innerHTML = months.map(m => `<option value="${m}">${m}</option>`).join("");
  if(months.includes(prevVal)) sel.value = prevVal;
  else if(months.length) sel.value = months[months.length-1];
  sel.onchange = renderCompare;
}

function metricsFor(rows){
  const spend = rows.reduce((a,b)=>a+b.spend,0);
  const impr = rows.reduce((a,b)=>a+b.impr,0);
  const clicks = rows.reduce((a,b)=>a+b.clicks,0);
  return {
    spend, impr, clicks,
    cpc: clicks? spend/clicks : null,
    ctr: impr? clicks/impr*100 : null,
    cpm: impr? spend/impr*1000 : null,
  };
}

function renderCompare(){
  const months = monthList();
  const sel = document.getElementById("month-select");
  const currentMonth = sel.value;
  const idx = months.indexOf(currentMonth);
  const prevMonth = idx>0 ? months[idx-1] : null;

  const grid = document.getElementById("compare-grid");
  grid.innerHTML = "";

  [prevMonth, currentMonth].forEach((m, i) => {
    const box = document.createElement("div");
    box.className = "compare-box";
    if(!m){
      box.innerHTML = `<div class="month-label">이전 달 없음</div>`;
      grid.appendChild(box);
      return;
    }
    let rows = ALL_ROWS.filter(r => getMonthKey(r.date)===m);
    if(countryRegionFilter !== "전체"){
      rows = rows.filter(r => regionOfRow(r)===countryRegionFilter);
    }
    const byCountry = {};
    rows.forEach(r => {
      byCountry[r.country] = byCountry[r.country] || [];
      byCountry[r.country].push(r);
    });
    const tableRows = Object.entries(byCountry)
      .map(([c, crows]) => ({country:c, m:metricsFor(crows)}))
      .sort((a,b)=>b.m.spend-a.m.spend)
      .map(({country,m}) => `<tr><td>${country}</td><td>${fmt(m.spend)}</td><td>${fmt(m.impr)}</td><td>${fmt(m.clicks)}</td><td>${fmt(m.cpc)}</td><td>${pct(m.ctr)}</td><td>${fmt(m.cpm)}</td></tr>`)
      .join("");
    box.innerHTML = `
      <div class="month-label">${m} ${i===1?"(당월)":"(전월)"}</div>
      <table class="detail">
        <tr><th>국가</th><th>지출</th><th>노출</th><th>클릭</th><th>CPC</th><th>CTR</th><th>CPM</th></tr>
        ${tableRows}
      </table>`;
    grid.appendChild(box);
  });
}

function renderCountryPage(){
  renderCountryRegionFilter();
  renderMonthSelect();
  renderCompare();
}

// ===== 페이지 전환 =====
document.getElementById("goto-country").onclick = () => {
  document.getElementById("page-main").classList.remove("active");
  document.getElementById("page-country").classList.add("active");
};
document.getElementById("back-to-main").onclick = () => {
  document.getElementById("page-country").classList.remove("active");
  document.getElementById("page-main").classList.add("active");
};
document.getElementById("refresh-btn").onclick = () => loadAll(true);

loadAll(false);
</script>
